#####################################
## Account Configuration
#####################################
account.code=${ACCOUNT_CODE:SS}

cache.directory=${CACHE_DIRECTORY:./cache}

#####################################
## RabbitMQ Configuration
#####################################
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

#####################################
# Datasource
#####################################
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/spread_realtime?useSSL=false&zeroDateTimeBehavior=convertToNull&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME:spread_realtime}
spring.datasource.password=${MYSQL_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

#################################################
## Logging
#################################################
logging.level.com.smc.mt5priceapi=DEBUG
